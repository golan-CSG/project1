<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Road bike frame - more aggressive geometry -->

  <!-- Top tube (slightly sloped) -->
  <line x1="28" y1="28" x2="68" y2="32" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

  <!-- Down tube (long, aggressive angle) -->
  <line x1="28" y1="28" x2="72" y2="68" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Seat tube (steep, vertical) -->
  <line x1="68" y1="32" x2="72" y2="68" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Chain stay (horizontal, short) -->
  <line x1="72" y1="68" x2="22" y2="72" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

  <!-- Seat stay (thin, elegant) -->
  <line x1="68" y1="32" x2="22" y2="72" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <!-- Head tube (short, steep) -->
  <rect x="22" y="22" width="8" height="16" rx="4" fill="#1e293b"/>

  <!-- Bottom bracket shell -->
  <circle cx="72" cy="68" r="6" fill="#1e293b"/>

  <!-- Rear dropout -->
  <rect x="17" y="69" width="7" height="7" rx="2" fill="#374151"/>

  <!-- Fork (carbon-style, thin) -->
  <path d="M26 30 Q18 50 17 72" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Seat post -->
  <line x1="70" y1="32" x2="70" y2="18" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Saddle hint -->
  <path d="M63 17 Q70 14 77 17" stroke="#374151" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Water bottle cage mounts (dots on down tube) -->
  <circle cx="52" cy="51" r="2" fill="#1e293b"/>
  <circle cx="46" cy="44" r="2" fill="#1e293b"/>
</svg>