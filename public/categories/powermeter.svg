<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Crank arm -->
  <rect x="44" y="20" width="12" height="50" rx="4" fill="#1e293b"/>
  <!-- Pedal spindle -->
  <rect x="38" y="66" width="24" height="8" rx="4" fill="#374151"/>
  <!-- Power meter pod on crank -->
  <rect x="34" y="38" width="32" height="20" rx="5" fill="#16a34a"/>
  <!-- Gauge dial -->
  <circle cx="50" cy="48" r="7" fill="#0f172a"/>
  <!-- Needle -->
  <line x1="50" y1="48" x2="54" y2="44" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <!-- Watt ticks -->
  <line x1="50" y1="43" x2="50" y2="44.5" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="45" y1="48" x2="46.5" y2="48" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="54" y1="48" x2="55" y2="48" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Spider/chainring top -->
  <circle cx="50" cy="20" r="9" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="50" cy="20" r="3" fill="#1e293b"/>
  <!-- "W" mark -->
  <text x="50" y="34" font-size="7" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">W</text>
</svg>
