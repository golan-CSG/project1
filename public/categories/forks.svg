<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Steerer clamp (vertical tube clamp) -->
  <rect x="38" y="55" width="16" height="28" rx="8" fill="#374151"/>
  <!-- Clamp bolts -->
  <circle cx="46" cy="60" r="2.5" fill="#94a3b8"/>
  <circle cx="46" cy="78" r="2.5" fill="#94a3b8"/>

  <!-- Stem body (horizontal arm) -->
  <rect x="38" y="38" width="42" height="14" rx="7" fill="#1e293b"/>

  <!-- Handlebar clamp (at the end) -->
  <rect x="72" y="28" width="18" height="32" rx="9" fill="#374151"/>
  <!-- Handlebar clamp bolts -->
  <circle cx="81" cy="36" r="2.5" fill="#94a3b8"/>
  <circle cx="81" cy="52" r="2.5" fill="#94a3b8"/>

  <!-- Handlebar (passing through clamp) -->
  <line x1="81" y1="10" x2="81" y2="90" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>

  <!-- Faceplate lines -->
  <line x1="73" y1="36" x2="89" y2="36" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="73" y1="52" x2="89" y2="52" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stem top cap -->
  <circle cx="46" cy="38" r="8" fill="#4b5563"/>
  <circle cx="46" cy="38" r="3" fill="#94a3b8"/>
</svg>