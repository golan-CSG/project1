<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- MTB with full suspension feel, knobby tires -->

  <!-- Rear wheel - thick knobby tire -->
  <circle cx="23" cy="67" r="19" fill="#1e293b"/>
  <circle cx="23" cy="67" r="15" fill="#374151"/>
  <circle cx="23" cy="67" r="10" fill="#e2e8f0"/>
  <circle cx="23" cy="67" r="4" fill="#1e293b"/>
  <!-- Knobby tread marks -->
  <circle cx="23" cy="48" r="2" fill="#1e293b"/>
  <circle cx="23" cy="86" r="2" fill="#1e293b"/>
  <circle cx="4" cy="67" r="2" fill="#1e293b"/>
  <circle cx="42" cy="67" r="2" fill="#1e293b"/>
  <circle cx="10" cy="54" r="2" fill="#1e293b"/>
  <circle cx="36" cy="80" r="2" fill="#1e293b"/>
  <circle cx="36" cy="54" r="2" fill="#1e293b"/>
  <circle cx="10" cy="80" r="2" fill="#1e293b"/>
  <!-- Spokes -->
  <line x1="23" y1="63" x2="23" y2="52" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="23" y1="71" x2="23" y2="82" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="12" y1="67" x2="19" y2="67" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="27" y1="67" x2="34" y2="67" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="15" y1="58" x2="20" y2="63" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="26" y1="71" x2="31" y2="76" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Front wheel - thick knobby tire -->
  <circle cx="77" cy="67" r="19" fill="#1e293b"/>
  <circle cx="77" cy="67" r="15" fill="#374151"/>
  <circle cx="77" cy="67" r="10" fill="#e2e8f0"/>
  <circle cx="77" cy="67" r="4" fill="#1e293b"/>
  <!-- Knobby tread marks -->
  <circle cx="77" cy="48" r="2" fill="#1e293b"/>
  <circle cx="77" cy="86" r="2" fill="#1e293b"/>
  <circle cx="58" cy="67" r="2" fill="#1e293b"/>
  <circle cx="96" cy="67" r="2" fill="#1e293b"/>
  <circle cx="64" cy="54" r="2" fill="#1e293b"/>
  <circle cx="90" cy="80" r="2" fill="#1e293b"/>
  <circle cx="90" cy="54" r="2" fill="#1e293b"/>
  <circle cx="64" cy="80" r="2" fill="#1e293b"/>
  <!-- Spokes -->
  <line x1="77" y1="63" x2="77" y2="52" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="77" y1="71" x2="77" y2="82" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="66" y1="67" x2="73" y2="67" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="81" y1="67" x2="88" y2="67" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- MTB Frame - slack geometry, green -->
  <!-- Top tube (slightly sloped) -->
  <line x1="37" y1="38" x2="60" y2="41" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="37" y1="38" x2="62" y2="67" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="57" y1="38" x2="62" y2="67" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="62" y1="67" x2="23" y2="67" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="57" y1="38" x2="23" y2="67" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Suspension fork (with stanchions) -->
  <line x1="37" y1="38" x2="35" y2="50" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="77" y2="67" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork stanchion detail -->
  <rect x="31" y="46" width="8" height="8" rx="2" fill="#94a3b8"/>

  <!-- Head tube -->
  <rect x="33" y="31" width="7" height="14" rx="3" fill="#1e293b"/>
  <!-- BB -->
  <circle cx="62" cy="67" r="5" fill="#1e293b"/>

  <!-- Flat handlebar (wide MTB style) -->
  <line x1="22" y1="28" x2="48" y2="28" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="28" x2="36" y2="34" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Grips -->
  <rect x="19" y="25" width="6" height="6" rx="3" fill="#1e293b"/>
  <rect x="45" y="25" width="6" height="6" rx="3" fill="#1e293b"/>

  <!-- Saddle -->
  <path d="M50 30 Q57 27 65 28" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <line x1="57" y1="28" x2="57" y2="38" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
</svg>