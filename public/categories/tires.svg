<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tire outer -->
  <circle cx="50" cy="50" r="44" fill="#1e293b"/>
  <!-- Tire tread pattern -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#374151" stroke-width="10" stroke-dasharray="8 4"/>
  <!-- Rim -->
  <circle cx="50" cy="50" r="32" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- Inner rim -->
  <circle cx="50" cy="50" r="22" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <!-- Hub -->
  <circle cx="50" cy="50" r="8" fill="#475569"/>
  <!-- Valve stem -->
  <rect x="48" y="6" width="4" height="12" rx="2" fill="#6b7280"/>
</svg>