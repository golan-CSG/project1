<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Saddle top - wider and more realistic bike seat shape -->
  <path d="M20 38 Q25 28 50 26 Q75 28 80 38 Q72 48 50 50 Q28 48 20 38Z" fill="#1e293b"/>
  <!-- Saddle nose -->
  <path d="M46 50 Q50 52 54 50 L58 65 Q50 68 42 65Z" fill="#1e293b"/>
  <!-- Saddle highlight/texture -->
  <path d="M28 36 Q40 30 62 30 Q72 32 76 38 Q66 42 50 43 Q34 42 28 36Z" fill="#374151"/>
  <!-- Center seam -->
  <line x1="50" y1="27" x2="50" y2="65" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Rails -->
  <line x1="35" y1="50" x2="28" y2="82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="50" x2="72" y2="82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Rail crossbar -->
  <line x1="28" y1="82" x2="72" y2="82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Seatpost clamp -->
  <rect x="44" y="78" width="12" height="8" rx="3" fill="#475569"/>
  <!-- Seatpost -->
  <rect x="46" y="82" width="8" height="14" rx="4" fill="#374151"/>
</svg>